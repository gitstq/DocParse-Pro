[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docparse-pro"
version = "1.0.0"
description = "A powerful document parsing tool with OCR, table extraction, and multi-format output support"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "DocParse-Pro Team" }
]
keywords = ["pdf", "ocr", "document", "parser", "table-extraction", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "pdfplumber>=0.10.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    "python-docx>=1.0.0",
    "openpyxl>=3.1.0",
    "tabulate>=0.9.0",
    "chardet>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
]
ai = [
    "openai>=1.0.0",
]

[project.scripts]
docparse = "docparse_pro.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/DocParse-Pro"
Documentation = "https://github.com/yourusername/DocParse-Pro#readme"
Repository = "https://github.com/yourusername/DocParse-Pro"
Issues = "https://github.com/yourusername/DocParse-Pro/issues"

[tool.hatch.build.targets.wheel]
packages = ["docparse_pro"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
